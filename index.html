<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#B4532A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family" />
    <title>Family Dashboard</title>
    <script>
      // Set the theme before first paint so dark mode doesn't flash light.
      // (src/lib/theme.jsx takes over once the app loads.)
      try {
        var p = localStorage.getItem('theme-pref')
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (location.pathname.indexOf('/wall') !== 0) document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Bangers&family=Cinzel:wght@700;900&family=Press+Start+2P&family=Monoton&family=Russo+One&family=Anton&family=Bowlby+One+SC&family=Saira+Stencil+One&family=Pacifico&family=Graduate&family=Playfair+Display:ital,wght@1,900&family=Bungee&family=Uncial+Antiqua&family=Metal+Mania&family=Orbitron:wght@900&family=Creepster&family=Rye&family=Limelight&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
